services:
  mhcquant:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: $GITHUB_TOKEN
    image: mhcquant
    container_name: mhcquant
    restart: always
    ports:
      - 8501:8501
    volumes:
      - workspaces-mhcquant:/workspaces-mhcquant
    environment:
      # Number of Streamlit server instances (default: 1 = no load balancer).
      # Set to >1 to enable nginx load balancing across multiple Streamlit instances.
      - STREAMLIT_SERVER_COUNT=1
volumes:
  workspaces-mhcquant:
